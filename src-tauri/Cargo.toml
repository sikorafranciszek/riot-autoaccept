[package]
name = "riot-autoaccept"
version = "1.0.0"
description = "Auto-accept ready check for League of Legends and Teamfight Tactics"
authors = ["F. Sikora"]
license = "MIT"
repository = "https://github.com/sikorafranciszek/riot-autoaccept"
edition = "2021"
rust-version = "1.77"

[lib]
name = "riot_autoaccept_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-store = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", features = ["ring"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sysinfo = "0.32"
base64 = "0.22"
dirs = "5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
